<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">

<title>Răng Long Đầu Bạc</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eaf5ff;
    text-align: center;
}

.game {
    max-width: 800px;
    margin: 50px auto;
}

h1 {
    font-size: 42px;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.question {
    font-size: 32px;
    margin: 30px;
}

button {
    font-size: 28px;
    padding: 20px 50px;
    margin: 10px;
    border: none;
    border-radius: 18px;
    cursor: pointer;
}

.lau {
    background: #ffd85c;
}

.lau2 {
    background: #8dd8ff;
}

button:hover {
    transform: scale(1.05);
}

.feedback {
    font-size: 25px;
    margin: 25px;
    min-height: 40px;
}

.next {
    background: #183153;
    color: white;
}

</style>
</head>

<body>

<div class="game">

<h1>🕵️ Răng Long Đầu Bạc 🐥</h1>

<div class="card">

<p id="progress"></p>

<h2>⭐ Điểm: <span id="score">0</span></h2>

<div class="question" id="question"></div>

<button class="Có" onclick="checkAnswer('Có')">
Có
</button>

<button class="không" onclick="checkAnswer('Không')">
Không
</button>

<div class="feedback" id="feedback"></div>

<button class="next" id="next" onclick="nextQuestion()" style="display:none">
Câu tiếp theo ➜
</button>

</div>

</div>

<script>

const questions = [

{
    text: "Em ___ Yêu Anh Không?.",
    answer: "Có"
},

{
    text: "Em ___ Yêu Anh Nhiều Không?.",
    answer: "Có"
},

{
    text: "Em ___ Đợi Anh Không?.",
    answer: "Có"
},

{
    text: "Chúng Ta ___ Đi Nhà Thờ Không?.",
    answer: "Có"
},

{
    text: "Chúng Ta ___ Đi Lên Thăm Bà Nội Không?.",
    answer: "Có"
},

{
    text: "Chúng Ta ___ Ở Lại Mấy Ngày Để Đi Chơi Không?",
    answer: "Có"
}

];

let currentQuestion = 0;

let score = 0;

let answered = false;


function showQuestion() {

    answered = false;

    document.getElementById("question").innerText =
        questions[currentQuestion].text;

    document.getElementById("progress").innerText =
        "Câu " + (currentQuestion + 1)
        + " / "
        + questions.length;

    document.getElementById("feedback").innerText = "";

    document.getElementById("next").style.display = "none";
}


function checkAnswer(choice) {

    if (answered) return;

    answered = true;

    let correct =
        questions[currentQuestion].answer;

    if (choice === correct) {

        score++;

        document.getElementById("score").innerText =
            score;

        document.getElementById("feedback").innerText =
            "🎉 Em Tuyệt Quá! +1 điểm";

    } else {

        document.getElementById("feedback").innerText =
            "💡 Chưa đúng. Đáp án là " + correct;

    }

    document.getElementById("next").style.display =
        "inline-block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= questions.length) {

        document.querySelector(".card").innerHTML =

        `
        <h1>🎉 Hoan hô Vợ Yêu!</h1>

        <h2>🏆 Hôn Vợ ${score} / ${questions.length} điểm</h2>

        <p style="font-size:25px">
        Vợ Yêu Đã Hoàn Thành !
        </p>

        <button onclick="location.reload()">
        🔄 Chơi lại
        </button>
        `;

    } else {

        showQuestion();

    }
}


showQuestion();

</script>

</body>
</html>
